[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "biblio-search"
version = "0.13.0"
description = "Turn research questions from any discipline into rigorous, reproducible search strategies for PubMed, arXiv and OpenAlex."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "juanmmm21", email = "martoscuevasjuan@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28,<1",
    # 0.135 trae Server-Sent Events nativos (fastapi.sse), que usa la interfaz web.
    "fastapi>=0.135,<1",
    "uvicorn>=0.30,<1",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
biblio-search = "biblio_search.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/biblio_search"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# TestClient de Starlette pide httpx2; la herramienta sigue usando httpx en tiempo de ejecución.
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
