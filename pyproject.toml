[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "biblio-search"
version = "0.2.0"
description = "Turn a structured clinical question (SPC/PICO) into a rigorous PubMed search strategy."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "juanmmm21", email = "martoscuevasjuan@gmail.com" }]
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<1"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
biblio-search = "biblio_search.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/biblio_search"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
